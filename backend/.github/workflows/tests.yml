name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        run: pytest -q

      - name: Seed smoke test
        run: |
          python -m app.seed --reset
          python -c "from app.db import engine; from sqlmodel import Session, select; from app.models import Role, Task, Skill, Signal; s=Session(engine); counts=(len(s.exec(select(Role)).all()), len(s.exec(select(Task)).all()), len(s.exec(select(Skill)).all()), len(s.exec(select(Signal)).all())); assert counts == (6, 31, 15, 20), counts; print('seed counts ok', counts)"

  # The pytest job above runs on in-memory SQLite. This job exercises the
  # PostgreSQL path that Supabase actually uses: RLS, TRUNCATE, numeric/date
  # types, migrations and the psycopg driver.
  postgres:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify schema, seed, migrations and API on PostgreSQL
        run: |
          python scripts/verify_pg.py \
            --url postgresql://postgres:postgres@localhost:5432/postgres
