name: frontend

on:
  push:
    branches: [main]
    paths:
      - "pivott-web-application-design/**"
      - "backend/tests/golden.json"
      - "scripts/**"
      - ".github/workflows/frontend.yml"
  pull_request:
    paths:
      - "pivott-web-application-design/**"
      - "backend/tests/golden.json"
      - "scripts/**"
      - ".github/workflows/frontend.yml"

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pivott-web-application-design
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: pnpm/action-setup@v4
        with:
          version: 12.3.4
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Copy rules
        run: node ../scripts/checks/lint-copy.mjs --self-test && node ../scripts/checks/lint-copy.mjs
      - name: Test
        run: pnpm test
      - name: Type check
        run: pnpm exec tsc --noEmit --incremental false
      - name: Build
        run: pnpm build
